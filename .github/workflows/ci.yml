name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes, so a stale red
# check never blocks a fresh green one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: quality (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check --diff .

      - name: mypy (strict)
        run: mypy

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The code is pure Python, so the full interpreter matrix runs on Linux
        # and each other OS gets one job: coverage of platform behaviour without
        # paying for nine redundant runners.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: "Tests (coverage gate: 95% branch)"
        run: python -m pytest

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: ci gate
    # A single required status check for branch protection: this job summarises
    # the matrix, so protection rules do not have to be edited when the matrix is.
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs did not succeed."
          exit 1

      - name: Confirm everything succeeded
        run: echo "quality and the full test matrix passed."
