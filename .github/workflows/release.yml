name: release

on:
  push:
    # Tag filters are glob patterns, not regular expressions: "v*" is the whole
    # set of release tags, and the workflow still asserts that the tag matches
    # _version.py before it publishes anything.
    tags:
      - "v*"

# Writing a release needs the package contents; everything else stays read-only.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the tag matches the package version
        run: |
          python - <<'PY'
          import pathlib
          import re

          source = pathlib.Path("src/modelcard_lint/_version.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          tag = "${{ github.ref_name }}".lstrip("v")
          if version != tag:
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          print(f"tag {tag} matches package version {version}")
          PY

      - name: Verify the wheel has no runtime dependencies
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(
                  archive.read(name).decode()
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
          requires = [line for line in metadata.splitlines() if line.startswith("Requires-Dist:")]
          runtime = [line for line in requires if "extra ==" not in line]
          if runtime:
              raise SystemExit(f"unexpected runtime dependencies: {runtime}")
          print("wheel declares no runtime dependencies (ADR 0001 holds)")
          PY

      - name: Publish GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
