[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcard-lint"
version = "0.2.0"
description = "A zero-dependency CI gate for ML model-card manifests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Caden Wate" }]
keywords = ["mlops", "model-cards", "lint", "supply-chain", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Zero runtime dependencies is a deliberate design decision -- see
# docs/adr/0001-zero-runtime-dependencies.md for the rationale.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
modelcard-lint = "modelcard_lint.cli:main"

[project.urls]
Homepage = "https://github.com/CadenW3/Competency"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelcard_lint = ["py.typed"]

# --------------------------------------------------------------------------
# Ruff: linting + formatting (single tool for both, one config, no drift)
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # ruff-specific
]
ignore = [
    "ANN401", # Any is intentional in the JSON boundary
    "D203",   # incompatible with D211 (blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary placement)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "ANN"]
"tools/**.py" = ["D103", "T201"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# mypy: strict typing on the package, relaxed for tests/tools
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*", "tools.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# --------------------------------------------------------------------------
# pytest + coverage: the CI gate mirrors these exact options
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", ".", "tools"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=modelcard_lint",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["modelcard_lint"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
